name: Python CI/CD Demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: CI - Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run automated unit tests
        run: python -m unittest discover -s tests -v

      - name: Build the HTML website
        run: python build_site.py

      - name: Upload the website as a Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: CD - Deploy website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy successful build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
